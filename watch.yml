name: Golfbevakning

on:
  schedule:
    - cron: "*/5 * * * *"   # var 10:e minut (ändra till */30 om repot är privat)
  workflow_dispatch:          # gör att du kan köra manuellt

permissions:
  contents: write

concurrency:
  group: golfbevakning
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Kör bevakning
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Spara state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Uppdatera state" && git push)
